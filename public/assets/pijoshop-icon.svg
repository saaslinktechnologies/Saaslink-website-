    <path d="M46 72C48 70 51 68 56 68L64 68C67 66 69 61 72 59C73.5 58 75 58.5 75.5 60C76 61.5 75 63 74 65L71 68L76 68C77.5 68 78 69 77.5 70.5L75 74C74 75 72.5 75.5 70 75.5H48C46 75.5 45 74 46 72Z" fill="url(#pijoGrad)" />
    
