      <stop offset="0%" stop-color="#F5DE98" />
      <stop offset="50%" stop-color="#E5C158" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <linearGradient id="pijoBg" x1="0%" y1="0%" x2="100%" y2="100%">
