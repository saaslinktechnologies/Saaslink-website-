<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5DE98" />
      <stop offset="45%" stop-color="#E5C158" />
      <stop offset="100%" stop-color="#C29B27" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2925" />
      <stop offset="100%" stop-color="#141E1B" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#E5C158" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Geometric Architectural Emblem (Layers / Diamond Hexagon) -->
  <g filter="url(#goldGlow)">
    <!-- Top Diamond / Layer -->
    <path d="M60 26L86 42L60 58L34 42L60 26Z" fill="url(#goldGrad)" opacity="0.95" />
    
    <!-- Middle Layer -->
    <path d="M34 52L60 68L86 52L86 58L60 74L34 58L34 52Z" fill="url(#goldGrad)" opacity="0.8" />
    
    <!-- Bottom Layer -->
    <path d="M34 68L60 84L86 68L86 74L60 90L34 74L34 68Z" fill="url(#goldGrad)" opacity="0.65" />
    
    <!-- Central Node Core -->
    <circle cx="60" cy="42" r="4.5" fill="#141E1B" stroke="url(#goldGrad)" stroke-width="2" />
  </g>
</svg>
